[project]
name = "voice-pipeline"
version = "0.1.0"
description = "Local STT/TTS adapters + eval harness for FuckTyping personal voice agents (Apple Silicon)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# STT backends — install only what you want to benchmark
parakeet = ["parakeet-mlx"]
whispercpp = ["pywhispercpp"]
nemo = ["nemo_toolkit[asr]"]
sherpa = ["sherpa-onnx"]
# TTS (MisoTTS itself is installed separately from its cloned repo)
miso = ["torch>=2.2", "torchaudio>=2.2"]
# nicer WER reporting (optional; a pure-python fallback is built in)
metrics = ["jiwer>=3.0"]
# high-quality resampling for the streaming harness (linear-interp fallback otherwise)
stream = ["scipy>=1.11"]
# Pipecat voice-agent runtime (local SmallWebRTC transport + Cloudflare bridge deps)
agent = [
    "pipecat-ai[silero,webrtc]",
    "websockets>=12",
    "aiortc>=1.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice_pipeline*"]
