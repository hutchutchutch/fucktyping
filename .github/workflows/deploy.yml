name: Optional GitHub Cloudflare deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      production_confirmation:
        description: Type deploy-production for a production release
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/edge/package-lock.json
            apps/studio/package-lock.json
      - run: npm ci
        working-directory: apps/edge
      - run: npm ci
        working-directory: apps/studio
      - name: Check types and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Build Studio
        run: npm run build
        working-directory: apps/studio

  deploy-staging:
    name: Deploy staging
    if: inputs.environment == 'staging'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://fucktyping-edge-staging.hutchenbach.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/edge/package-lock.json
            apps/studio/package-lock.json
      - run: npm ci
        working-directory: apps/edge
      - run: npm ci
        working-directory: apps/studio
      - name: Apply staging D1 migrations
        run: npm run db:migrate:staging
        working-directory: apps/edge
      - name: Deploy isolated staging Worker
        run: npm run deploy:staging
        working-directory: apps/edge
      - name: Smoke-test staging
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 3 https://fucktyping-edge-staging.hutchenbach.workers.dev/health

  deploy-production:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' &&
      inputs.production_confirmation == 'deploy-production' &&
      github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://fucktyping-edge.hutchenbach.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/edge/package-lock.json
            apps/studio/package-lock.json
      - run: npm ci
        working-directory: apps/edge
      - run: npm ci
        working-directory: apps/studio
      - name: Record rollback points
        run: |
          npx wrangler deployments status --env=""
          npx wrangler d1 time-travel info fucktyping --env=""
        working-directory: apps/edge
      - name: Apply additive production D1 migrations
        run: npm run db:migrate
        working-directory: apps/edge
      - name: Deploy production Worker
        run: npm run deploy
        working-directory: apps/edge
      - name: Smoke-test production
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 3 https://fucktyping-edge.hutchenbach.workers.dev/health
